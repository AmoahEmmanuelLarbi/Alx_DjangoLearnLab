{% extends "blog/base.html" %}



{% block content %}
<div class="search">
    <form action="" method="get">
        <input type="text" name="query" placeholder="Search post ...">
        <button type="submit">Search</button>
    </form>

</div>
<div class="container">
    <h2>Posts tagged: "{{tag.name}}"</h2>

    {% for post in posts %}
    <h3>{{ post.title }}</h3>
    <p>{{ post.content }}</p>
    <!-- <small>Tags: {{tag_name}}</small> -->


    <p>
        Tags:
        {% for tag in post.tags.all %}
        <!-- <span><small>{{tag.name}}</small></span> -->
        <a href="{% url 'tag_posts' tag.name %}">{{tag.name}}</a>
        {% endfor %}
    </p>


</div>

{% empty %}
<p>No post found.</p>

{% endfor %}

<!--add link to create new blog -->
<a href="{% url 'create' %}">Create New Blog</a>

{% endblock %}
