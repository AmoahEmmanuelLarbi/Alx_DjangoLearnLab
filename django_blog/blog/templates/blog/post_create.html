{% extends "blog\base.html" %}
{% block content %}

<h2>

    Edit Post
    {% else %}
    Create Post
    {% endif %}
</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

</form>


{% endblock %}
