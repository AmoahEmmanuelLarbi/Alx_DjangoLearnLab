{% extends "blog\base.html" %}

{% block content %}
    <h2>
        {% if form.instance.pk %}
            Edit Comment for post: {{post.title}}
        {% else %}
            Create Comment for post: {{post.title}}
        {% endif %}
    </h2>
    <form method="post">
        {% csrf_token %}
        {{form.as_p}}
        <button type="submit">SAVE COMMENT</button>
    </form>



{% endblock %}
