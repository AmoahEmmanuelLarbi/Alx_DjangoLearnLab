{% extends "base.html" %}

{% block content %}
    <div class="container">
        <div class="card">
            <h2>Delete Post</h2>

            <p>
                Are you sure you want to delete
                <strong>"{{ post.title }}"</strong>?
            </p>

            <form method="post">
                {% csrf_token %}
                <div class="actions">
                    <button type="submit" class="btn btn-delete">
                        Yes, Delete
                    </button>

                    <a href="{% url 'posts' %}" class="btn btn-cancel">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
